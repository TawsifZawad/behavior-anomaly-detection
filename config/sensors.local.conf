# =====================================================================
# Live sensor feeds for  own / detect / watch  (and the .exe menu's
# [1] Own and [3] Live).
#
# Fill in your REAL Suricata / Wazuh output paths below, remove the
# leading '#', save, and just re-run. NO rebuild of the .exe is needed —
# this file is read at start-up.
#
# Leave everything commented to run host-only (the default). On a machine
# without Suricata/Wazuh, or with a wrong/blank path, the app simply
# skips that plane and keeps working.
#
# The reproducible `analyze` demo does NOT use this file — it always uses
# the bundled sample feeds, so the demo stays stable.
#
# Notes:
#   * Suricata eve.json is usually local, e.g.
#       Windows:  C:/Program Files/Suricata/log/eve.json
#       Linux:    /var/log/suricata/eve.json
#   * Wazuh alerts.json is written by the MANAGER with JSON output on:
#       /var/ossec/logs/alerts/alerts.json
#     If the manager is on another host, point at a shared/synced copy.
#   * Use forward slashes '/' even on Windows.
# =====================================================================

# SURICATA_EVE = C:/Program Files/Suricata/log/eve.json
# WAZUH_ALERTS = C:/wazuh/alerts.json
